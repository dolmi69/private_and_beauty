{% extends 'clinic/base.html' %}
{% block title %}Вход · Эвервелл{% endblock %}
{% block content %}<section class="section"><div class="container" style="max-width:600px">
  <div class="eyebrow">Личный кабинет</div><h1>Войти</h1>
  <form method="post" class="p-4 rounded-3 bg-white border">{% csrf_token %}
    {% if form.errors %}<p class="text-danger">Неверный логин или пароль.</p>{% endif %}
    <div class="mb-3"><label class="form-label" for="id_username">Логин</label><input class="form-control" id="id_username" name="username" autocomplete="username" required></div>
    <div class="mb-3"><label class="form-label" for="id_password">Пароль</label><input class="form-control" id="id_password" name="password" type="password" autocomplete="current-password" required></div>
    <input type="hidden" name="next" value="{{ next }}"><button class="btn btn-forest" type="submit">Войти</button>
  </form><p class="mt-3">Нет аккаунта? <a class="text-link" href="{% url 'clinic:register' %}">Зарегистрироваться как пациент</a></p>
</div></section>{% endblock %}
